[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rlhf-pipeline"
version = "0.1.0"
description = "GRPO (Group Relative Policy Optimization) post-training pipeline for LLM reasoning models."
authors = [{ name = "Aravind Sundaresan" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "sympy>=1.12"
]

[project.scripts]
rlhf-train = "rlhf_pipeline.cli:app"

[tool.setuptools.packages.find]
where = ["."]
