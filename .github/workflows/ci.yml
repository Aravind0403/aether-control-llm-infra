name: AetherControl CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Python Test Suites & Pre-flight Dataset Inspection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy pydantic pyyaml typer rich requests sympy
          pip install -e trainsight/ -e vllm-engine/ -e rlhf-pipeline/

      - name: Pre-flight Dataset Quality Inspections (Shift-Left Validation)
        run: |
          trainsight profile --dataset trainsight/sample_data/sample_sft.jsonl --type sft --strict
          trainsight profile --dataset trainsight/sample_data/sample_dpo.jsonl --type dpo --strict
          trainsight profile --dataset trainsight/sample_data/sample_gsm8k.jsonl --type sft --strict

      - name: Run Full 64-Test Suite Across All Modules
        run: |
          make test

      - name: Execute 4-Stage Platform Invariant Benchmark Suite
        run: |
          make benchmark
